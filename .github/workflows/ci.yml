name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.13'
  DJANGO_SETTINGS_MODULE: sumia.settings

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort
          pip install -r requirements.txt

      - name: Run Ruff (linting)
        run: ruff check .

      - name: Run Black (format check)
        run: black --check --diff .

      - name: Run isort (import sort check)
        run: isort --check-only --diff .

  django-checks:
    name: Django Deployment Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Run Django deployment checks
        env:
          DJANGO_SECRET_KEY: 'test-secret-key-for-ci-only'
          DJANGO_DEBUG: 'False'
          DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
          SECURE_SSL_REDIRECT: 'True'
          SESSION_COOKIE_SECURE: 'True'
          CSRF_COOKIE_SECURE: 'True'
          SECURE_HSTS_SECONDS: '31536000'
          SECURE_HSTS_INCLUDE_SUBDOMAINS: 'True'
          SECURE_HSTS_PRELOAD: 'True'
        run: python manage.py check --deploy

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: 'test-secret-key-for-ci-only'
          DJANGO_DEBUG: 'True'
          DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
        run: |
          python manage.py test --verbosity=2

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Run Safety (dependency vulnerability scan)
        run: safety check -r requirements.txt

      - name: Run Bandit (static security analysis)
        run: bandit -r . -x .venv,venv,env,.git --skip B101

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint, django-checks, test, security]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect static files
        env:
          DJANGO_SECRET_KEY: 'test-secret-key-for-ci-only'
          DJANGO_DEBUG: 'False'
          DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
        run: python manage.py collectstatic --noinput --clear

      - name: Verify build artifacts
        run: |
          echo "Static files collected successfully"
          ls -la staticfiles_collected/