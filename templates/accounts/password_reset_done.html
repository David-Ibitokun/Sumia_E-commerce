{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'authentications/css/auth-styles.css' %}">

<section class="auth-container">
  <div class="auth-card">
    <div class="auth-card-body text-center py-4">
      <div class="mb-3">
        <i class="fas fa-envelope-circle-check text-success" style="font-size: 3rem;"></i>
      </div>
      <h3 class="auth-title mb-2">Check Your Email</h3>
      <p class="auth-subtitle mb-4">
        If an account exists with the email you entered, we have sent instructions to reset your password. Please check your inbox and spam folder.
      </p>

      <div class="auth-footer mt-4">
        <a href="{% url 'login' %}" class="btn btn-outline-dark rounded-pill px-4">
          <i class="fas fa-arrow-left me-1"></i> Return to Login
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
