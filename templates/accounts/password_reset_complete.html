{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'authentications/css/auth-styles.css' %}">

<section class="auth-container">
  <div class="auth-card">
    <div class="auth-card-body text-center py-4">
      <div class="mb-3">
        <i class="fas fa-check-circle text-success" style="font-size: 3rem;"></i>
      </div>
      <h3 class="auth-title mb-2">Password Reset Complete</h3>
      <p class="auth-subtitle mb-4">
        Your new password has been set successfully. You can now log in with your updated credentials.
      </p>

      <div class="auth-footer mt-4">
        <a href="{% url 'login' %}" class="btn btn-primary rounded-pill px-5">
          <i class="fas fa-sign-in-alt me-1"></i> Sign In Now
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
