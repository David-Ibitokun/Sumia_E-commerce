<div class="mb-5 d-flex flex-wrap justify-content-center gap-2 p-2 bg-white rounded-4 rounded-md-pill border shadow-sm mx-auto vendor-pill-nav" style="max-width: 680px;">
    <a href="{% url 'vendor_dashboard' %}" class="btn {% if request.resolver_match.url_name == 'vendor_dashboard' %}btn-primary{% else %}btn-light border-0{% endif %} rounded-pill px-4 fw-bold">
        <i class="fas fa-chart-pie me-2"></i> Dashboard
    </a>
    <a href="{% url 'add_product' %}" class="btn {% if request.resolver_match.url_name == 'add_product' %}btn-primary{% else %}btn-light border-0{% endif %} rounded-pill px-4 fw-bold">
        <i class="fas fa-plus-circle me-2"></i> Add Product
    </a>
    <a href="{% url 'product_list' %}" class="btn {% if request.resolver_match.url_name == 'product_list' or request.resolver_match.url_name == 'edit_product' %}btn-primary{% else %}btn-light border-0{% endif %} rounded-pill px-4 fw-bold">
        <i class="fas fa-boxes me-2"></i> My Products
    </a>
    <a href="{% url 'vendor_orders' %}" class="btn {% if 'order' in request.resolver_match.url_name %}btn-primary{% else %}btn-light border-0{% endif %} rounded-pill px-4 fw-bold">
        <i class="fas fa-receipt me-2"></i> Store Orders
    </a>
</div>
