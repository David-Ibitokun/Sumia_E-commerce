{% extends 'base.html' %}
{% load static %}

{% block title %}Page Not Found - 404 | Sumia{% endblock %}

{% block content %}
<section class="py-5 bg-light d-flex align-items-center" style="min-height: 70vh;">
  <div class="container text-center py-5">
    <div class="card border-0 shadow-sm rounded-4 p-5 mx-auto bg-white" style="max-width: 580px;">
      <div class="mb-3">
        <span class="rounded-circle bg-warning bg-opacity-10 d-inline-flex align-items-center justify-content-center text-warning" style="width: 100px; height: 100px;">
          <i class="fas fa-compass fa-3x"></i>
        </span>
      </div>
      <h1 class="display-3 fw-extrabold text-dark mb-2" style="font-weight: 800;">404</h1>
      <h3 class="fw-bold text-dark mb-2">Page Not Found</h3>
      <p class="text-muted mx-auto mb-4" style="max-width: 420px;">
        The page you are looking for may have been moved, renamed, or is temporarily unavailable.
      </p>
      <div class="d-flex flex-wrap justify-content-center gap-2">
        <a href="{% url 'home' %}" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">
          <i class="fas fa-home me-2"></i> Back to Homepage
        </a>
        <a href="{% url 'shop' %}" class="btn btn-outline-dark rounded-pill px-4 fw-semibold">
          <i class="fas fa-store me-2"></i> Browse Shop
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
