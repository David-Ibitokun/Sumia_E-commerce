<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumia - Registration</title>
    <link rel="stylesheet" href="{% static 'auth' 'styles.css' %}" />
</head>
<body>
    {% block content %}
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-card-body">
                <h1>Sumia Registration</h1>
                
                <!-- Registration Form -->
                <form method="post" action="{% url 'register' %}" class="auth-form">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name" placeholder="Enter your first name" class="form-control-custom" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name" placeholder="Enter your last name" class="form-control-custom" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email address" class="form-control-custom" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="account_type">Account Type</label>
                        <select id="account_type" name="account_type" class="form-select-custom">
                            <option value="user">Regular User</option>
                            <option value="vendor">Vendor</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="agreed_to_terms">I agree to the terms and conditions</label>
                        <input type="checkbox" id="agreed_to_terms" name="agreed_to_terms" class="form-check-input" required>
                    </div>
                    
                    <button type="submit" class="btn-primary-auth">Create Account</button>
                </form>
            </div>
        </div>
    </div>
    
    <script src="{% static 'auth' 'scripts.js' %}"></script>
</body>
</html>
